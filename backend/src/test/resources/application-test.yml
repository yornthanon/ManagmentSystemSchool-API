spring:
  datasource:
    url: jdbc:h2:mem:school_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-only-jwt-secret-key-at-least-32-characters-long
    expiration-ms: 3600000
  admin:
    email: admin@school.edu
    password: test-admin-password
