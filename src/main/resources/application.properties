spring.application.name=ManagamentSystemSchool

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/school2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:130107}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=${PORT:8080}

# JWT Configuration (set JWT_SECRET env var in production!)
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# OAuth2 Google Configuration (set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET env vars in production!)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Application URLs
app.oauth2.redirect-url=${OAUTH2_REDIRECT_URL:http://localhost:5173/oauth2/redirect}

# Error Handling (production: set include-stacktrace=never)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
spring.web.resources.add-mappings=false
