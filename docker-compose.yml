services:
  postgres:
    image: postgres:14
    container_name: school
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 130107
      POSTGRES_DB: school2
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school2"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: Backend
    container_name: ManagementSystemSchool-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/school2
      DB_USERNAME: postgres
      DB_PASSWORD: "130107"
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_REDIRECT_URL: ${OAUTH2_REDIRECT_URL}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
