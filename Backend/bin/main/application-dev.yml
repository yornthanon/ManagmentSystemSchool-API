spring:
  datasource:
    url: jdbc:h2:mem:school;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBkZXZlbG9wbWVudCBzZWNyZXQ=}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
